<mat-toolbar id="toolbar">
  <mat-toolbar-row>
    <div>
      <button
        mat-mini-fab
        color="primary"
        (click)="onToggleSidenav()"
        aria-label="List"
      >
        <mat-icon>list</mat-icon>
      </button>
    </div>
    <img
      class="icon-logo"
      [src]="imageSRC"
      routerLink="/home"
      alt="Andrew Mulleady Logo"
    />
    <div>
      <app-pricing-card></app-pricing-card>
    </div>
  </mat-toolbar-row>
</mat-toolbar>
