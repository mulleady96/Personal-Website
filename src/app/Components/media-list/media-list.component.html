<app-search-button (searchChange)="onSearchChange($event)"></app-search-button>
@if (search) {
  <div class="search-chip-container">
    <mat-chip-set aria-label="Sort By Location">
      @for (location of locations; track location) {
        <mat-chip
          selected="location.selected"
          matBadge="{{ location.locationCount }}"
          (click)="toggleSelection(location)"
          [ngClass]="{ selected: location.selected }"
        >
          {{ location.name }}
        </mat-chip>
      }
    </mat-chip-set>
    <span>{{ count }}</span>
  </div>
}

@if (isLoading) {
  <div class="flex-center min-h-400">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <mat-menu #sharedMenu="matMenu" yPosition="above">
    <button mat-menu-item (click)="Pexels()" aria-label="View more on Pexels">
      <mat-icon>link</mat-icon>Pexels
    </button>
    <button mat-menu-item (click)="openPricingDialog()">
      <mat-icon>collections</mat-icon>Access Full Collection
    </button>
  </mat-menu>

  <div class="media-list-container">
    @for (image of imageList; track image.src) {
      <div class="media-list-item">
        @if (image.type === "video") {
          <iframe
            loading="lazy"
            [src]="image.src | safeYoutubeUrl"
            class="media-item"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        } @else {
          <div class="image-wrapper">
            <button
              mat-raised-button
              [matMenuTriggerFor]="sharedMenu"
              aria-label="icon-button with menu options"
              class="menu-button"
              (click)="$event.stopPropagation()"
            >
              {{ image.title }}
              <mat-icon>share</mat-icon>
            </button>
            <img
              [ngSrc]="image.src"
              width="1400"
              height="900"
              (click)="openModal(image)"
              alt="Photo of {{ image.title }}"
              class="media-item"
            />
          </div>
        }
      </div>
    }
  </div>
}
