<div class="app-container">
  <div class="glass-panel">
    <header class="header">
      <h1 class="gradient-text">Snap AR Experience</h1>
      <p>Discover interactive lenses powered by Snap Camera Kit</p>
    </header>

    <main class="main-content">
      <div class="camera-view">
        <div class="debug-info">
          Debug: SDK={{sdkStatus}} | Lenses={{lenses.length}} | Selected={{selectedLensId || 'none'}}
        </div>
        
        <div class="camera-frame" #cameraContainer>
          <!-- Canvas will be injected here -->
        </div>

        <div class="lens-selector-container">
          <div class="lens-controls-wrapper">
            <mat-form-field class="lens-dropdown">
              <mat-label>Select a lens...</mat-label>
              <mat-select [(ngModel)]="selectedLensId" (selectionChange)="onLensSelect()">
                @for (lens of lenses; track lens.id) {
                  <mat-option [value]="lens.id">
                    {{lens.name}}
                  </mat-option>
                }
              </mat-select>
            </mat-form-field>
            
            <button mat-fab color="accent" class="camera-toggle-btn" (click)="toggleCamera()" aria-label="Toggle camera">
              <mat-icon>flip_camera_ios</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
