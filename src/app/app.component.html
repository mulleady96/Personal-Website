<div [ngClass]="{ 'dark-theme': isDarkTheme() }">
  <mat-sidenav-container (backdropClick)="close('backdrop')">
    <mat-sidenav #sidenav (keydown.escape)="close('escape')">
      @if (!loginService.currentUser()) {
        <h2>
          {{ title }}
        </h2>
      }
      <app-login></app-login>
      <div class="nav-buttons-container">
        <span class="nav-sub-heading">GENERAL</span>

        <button
          class="side-menu-button"
          mat-button
          routerLinkActive="router-link-active"
          aria-label="Home"
          routerLink="/home"
        >
          <mat-icon color="accent">home</mat-icon>
          Home
        </button>

        <button
          class="side-menu-button"
          mat-button
          routerLinkActive="router-link-active"
          aria-label="Portfolio"
          routerLink="/portfolio"
        >
          <mat-icon color="accent">desktop_mac</mat-icon>
          Portfolio
        </button>

        <button
          class="side-menu-button"
          mat-button
          routerLinkActive="router-link-active"
          aria-label="Blog"
          routerLink="/blog"
        >
          <mat-icon color="accent">article</mat-icon>
          Blog
        </button>

        <button
          class="side-menu-button"
          mat-button
          routerLinkActive="router-link-active"
          aria-label="Get In Touch"
          routerLink="/enquire"
        >
          <mat-icon color="accent">edit</mat-icon>
          Get In Touch
        </button>

        <span class="nav-sub-heading">EXPLORE</span>

        <button
          class="side-menu-button"
          mat-button
          routerLinkActive="router-link-active"
          aria-label="Gallery"
          routerLink="/gallery"
        >
          <mat-icon color="accent">collections</mat-icon>
          Gallery
        </button>

        <button
          class="side-menu-button"
          mat-button
          routerLinkActive="router-link-active"
          aria-label="AR Corner"
          routerLink="/AR-corner"
        >
          <mat-icon color="accent">view_in_ar</mat-icon>
          AR Corner
        </button>
      </div>
      <div class="bottomSocial">
        <hr />
        @if (loginService.currentUser()) {
          <button
            class="side-menu-button logout-button"
            mat-button
            (click)="loginService.logout()"
            aria-label="Logout"
          >
            <mat-icon color="warn">logout</mat-icon>
            Logout
          </button>
        }
        <mat-slide-toggle
          [checked]="isDarkTheme()"
          (change)="onThemeChange($event.checked)"
        >
          <span>
            {{ themeDescription() }}
          </span>
        </mat-slide-toggle>
        <a
          href="https://github.com/mulleady96"
          target="_blank"
          rel="noreferrer"
        >
          <button mat-mini-fab color="accent" aria-label="Github button">
            <fa-icon [icon]="['fab', 'github']"></fa-icon>
          </button>
        </a>
        <a
          href="https://www.linkedin.com/in/andrew-mulleady-a6222a171/"
          target="_blank"
          rel="noreferrer"
        >
          <button mat-mini-fab color="accent" aria-label="LinkedIn">
            <fa-icon [icon]="['fab', 'linkedin']"></fa-icon>
          </button>
        </a>
        <a routerLink="/privacy-policy">
          <button mat-mini-fab color="accent" aria-label="Privacy Policy">
            <mat-icon>info</mat-icon>
          </button>
        </a>
      </div>
    </mat-sidenav>
    <mat-sidenav-content (swiperight)="sidenav.open()">
      <app-toolbar
        [imageSRC]="
          loginService.currentUser()?.bitmojiUrl ||
          loginService.currentUser()?.photoUrl ||
          imageSRC()
        "
        (toggleSidenav)="sidenav.open()"
      ></app-toolbar>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
