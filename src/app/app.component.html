<div [ngClass]="{ 'dark-theme': isDarkTheme() }">
  <mat-sidenav-container (backdropClick)="close('backdrop')">
    <mat-sidenav #sidenav (keydown.escape)="close('escape')">
      @if (!loginService.snapUser()) {
        <h2>
          {{ title }}
        </h2>
      }
      <div class="snap-login-container">
        @if (loginService.snapUser()) {
          <div class="snap-profile" style="display: flex; flex-direction: column; align-items: center;">
            <div matBadge="{{ loginService.snapUser()?.rewardsPoints }}" matBadgePosition="above after" matBadgeColor="accent">
              <img [src]="loginService.snapUser()?.bitmojiUrl" alt="Bitmoji" />
            </div>
            <span style="margin: 10px 0;">{{ loginService.snapUser()?.displayName }}</span>
            <button mat-stroked-button color="warn" (click)="loginService.logout()">
              <mat-icon>logout</mat-icon> Logout
            </button>
          </div>
        } @else {
          <button
            mat-button
            class="snap-login-btn"
            color="accent"
            (click)="loginService.loginWithSnapchat()"
          >
            <span class="snap-login-content">
              <fa-icon [icon]="['fab', 'snapchat']" size="lg"></fa-icon>
              Login with Snapchat
            </span>
          </button>
        }
      </div>
      <div class="nav-buttons-container">
        @for (button of navigationButtons; track button) {
          <button
            class="side-menu-button"
            mat-button
            routerLinkActive="router-link-active"
            [attr.aria-label]="button.ariaLabel"
            routerLink="{{ button.routerLink }}"
          >
            <mat-icon color="accent">{{ button.icon }}</mat-icon>
            {{ button.ariaLabel }}
          </button>
        }
      </div>
      <div class="bottomSocial">
        <mat-slide-toggle
          [checked]="isDarkTheme()"
          (change)="onThemeChange($event.checked)"
        >
          <span>
            {{ themeDescription() }}
          </span>
        </mat-slide-toggle>
        <a
          href="https://github.com/mulleady96"
          target="_blank"
          rel="noreferrer"
        >
          <button mat-mini-fab color="accent" aria-label="Github button">
            <fa-icon [icon]="['fab', 'github']"></fa-icon>
          </button>
        </a>
        <a
          href="https://www.linkedin.com/in/andrew-mulleady-a6222a171/"
          target="_blank"
          rel="noreferrer"
        >
          <button mat-mini-fab color="accent" aria-label="LinkedIn">
            <fa-icon [icon]="['fab', 'linkedin']"></fa-icon>
          </button>
        </a>
        <a routerLink="/privacy-policy">
          <button mat-mini-fab color="accent" aria-label="Privacy Policy">
            <mat-icon>info</mat-icon>
          </button>
        </a>
      </div>
    </mat-sidenav>
    <mat-sidenav-content (swiperight)="sidenav.open()">
      <app-toolbar
        [imageSRC]="loginService.snapUser()?.bitmojiUrl || imageSRC()"
        (toggleSidenav)="sidenav.open()"
      ></app-toolbar>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
